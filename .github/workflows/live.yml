name: MAJIX OS Live AMD64

on:
  push:
    branches: [main]
    paths:
      - build-live.sh
      - config/**
      - bin/**
      - tests/check-storage.sh
      - branding/plymouth/**
      - tests/check-boot-logo.py
      - .github/workflows/live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Test storage mode detection
        run: sh tests/check-storage.sh
      - name: Build with Debian 13 live-build
        run: |
          mkdir -p "$RUNNER_TEMP/majix"
          docker run --rm --privileged \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/out" \
            debian:13-slim bash -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y live-build ca-certificates rsync
              bash /src/build-live.sh /out/majix
            '
      - name: Verify checksum and BIOS/UEFI boot entries
        working-directory: ${{ runner.temp }}/majix
        run: |
          sha256sum -c SHA256SUMS
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 initramfs-tools-core
          xorriso -indev majix-os-0.1-alpha-amd64.iso -report_el_torito plain > boot-report.txt
          cat boot-report.txt
          grep -E 'El Torito boot img .*BIOS' boot-report.txt
          grep -E 'El Torito boot img .*UEFI' boot-report.txt
          xorriso -osirrox on -indev majix-os-0.1-alpha-amd64.iso \
            -extract /isolinux/live.cfg syslinux-live.cfg \
            -extract /boot/grub/grub.cfg grub-live.cfg
          for menu in syslinux-live.cfg grub-live.cfg; do
            grep -F 'Sesion temporal (sin guardar)' "$menu"
            grep -m 1 -E '^[[:space:]]+(append|linux)[[:space:]].*boot=live' "$menu" \
              | grep -F 'persistence-media=removable-usb persistence-storage=filesystem persistence-encryption=lukslabel persistence-label=MAJIX_DATA'
            grep -F 'nopersistence' "$menu" | grep -vF 'persistence-encryption='
          done
      - name: Boot the live system in QEMU
        working-directory: ${{ runner.temp }}/majix
        run: |
          mkdir boot
          xorriso -osirrox on -indev majix-os-0.1-alpha-amd64.iso \
            -extract_l /live boot '/live/vmlinuz-*' '/live/initrd.img-*'
          kernels=(boot/vmlinuz-*)
          initrds=(boot/initrd.img-*)
          test "${#kernels[@]}" -eq 1
          test "${#initrds[@]}" -eq 1
          lsinitramfs "${initrds[0]}" > initramfs-files.txt
          grep -E '^(usr/)?sbin/cryptsetup$' initramfs-files.txt
          grep -E '(^|/)dm-crypt\.ko(\.[[:alnum:]]+)?$' initramfs-files.txt
          touch boot.log

          qemu-system-x86_64 -machine accel=kvm:tcg -m 3072 -smp 2 -nic none \
            -cdrom majix-os-0.1-alpha-amd64.iso -display none -monitor none \
            -serial file:boot.log -no-reboot \
            -kernel "${kernels[0]}" -initrd "${initrds[0]}" \
            -append 'boot=live components hostname=majix username=majix locales=en_US.UTF-8 nox11autologin persistence persistence-media=removable-usb persistence-storage=filesystem persistence-encryption=lukslabel persistence-label=MAJIX_DATA console=ttyS0' &
          vm=$!
          trap 'kill "$vm" 2>/dev/null || true' EXIT
          for ((attempt = 0; attempt < 90; attempt++)); do
            if grep -q 'majix login:' boot.log; then
              tail -30 boot.log
              exit 0
            fi
            kill -0 "$vm" 2>/dev/null || break
            sleep 2
          done
          tail -100 boot.log
          exit 1
      - name: Check the MAJIX logo during boot in QEMU
        id: boot_logo
        run: python3 tests/check-boot-logo.py "$RUNNER_TEMP/majix/majix-os-0.1-alpha-amd64.iso" "$RUNNER_TEMP/majix/boot-logo.ppm"
      - uses: actions/upload-artifact@v4
        with:
          name: majix-os-0.1-alpha-amd64
          path: |
            ${{ runner.temp }}/majix/majix-os-0.1-alpha-amd64.iso
            ${{ runner.temp }}/majix/SHA256SUMS
            ${{ runner.temp }}/majix/boot-report.txt
            ${{ runner.temp }}/majix/boot-logo.ppm
          compression-level: 0
          if-no-files-found: error
